name: Build APK

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # A fixed signing key is what lets every new APK install over the previous one
      # without uninstalling (and losing data). It lives in the STYLY_KEYSTORE_B64 secret.
      - name: Restore signing key
        id: key
        env:
          KS: ${{ secrets.STYLY_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "stable=true" >> "$GITHUB_OUTPUT"
            FP=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -m1 "SHA256" || echo "keytool could not read the restored keystore")
            echo "::notice::restored keystore: $FP (secret length ${#KS})"
          else
            echo "::warning::STYLY_KEYSTORE_B64 secret is missing. This APK is signed with a random key. Do NOT install it."
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      # Gradle's default debug-key lookup did not pick up the restored key, so point it there explicitly.
      - name: Point Gradle at the fixed key
        if: steps.key.outputs.stable == 'true'
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("$HOME/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
          tail -14 android/app/build.gradle

      - name: Apply launcher icons and splash
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp resources/android/splash.png {} \;

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify signing certificate
        id: cert
        env:
          STABLE: ${{ steps.key.outputs.stable }}
        run: |
          EXPECTED=5762b81558dee98a958986552a76895f823728264fa3a0d60e3f003bd9539132
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          GOT=$("$AS" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "APK signing certificate SHA-256: $GOT"
          echo "sha=$GOT" >> "$GITHUB_OUTPUT"
          echo "::notice::apk certificate: $GOT"
          if [ "$STABLE" = "true" ] && [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match the expected Styly key (got '$GOT'). Not publishing."
            exit 1
          fi

      - name: Upload APK (not for install)
        if: steps.key.outputs.stable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: styly-temp-apk-DO-NOT-INSTALL
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Work branches get an installable preview artifact; only main may touch the public 'latest' release.
      - name: Upload preview APK (branch builds)
        if: steps.key.outputs.stable == 'true' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: styly-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the latest release
        if: steps.key.outputs.stable == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Styly.apk
          gh release delete latest --yes --cleanup-tag -R "${{ github.repository }}" || true
          gh release create latest Styly.apk -R "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Styly - آخر نسخة" \
            --notes "نزّل Styly.apk وثبّته فوق النسخة الموجودة. التحديث مش بيمسح البيانات. بصمة التوقيع (SHA-256): ${{ steps.cert.outputs.sha }}"
